# Evaluation & Generalization Benchmark Configuration

metrics:
  - "accuracy"
  - "balanced_accuracy"
  - "macro_precision"
  - "macro_recall"
  - "macro_f1"
  - "weighted_f1"
  - "false_positive_rate"
  - "false_negative_rate"
  - "roc_auc"
  - "pr_auc"

bootstrap:
  n_bootstraps: 500
  confidence_level: 0.95
  random_seed: 42

statistical_tests:
  mcnemar: true
  paired_t_test: true

cross_dataset_experiments:
  exp_a: "Edge-IIoTset locked test"
  exp_b: "CICIoT2023 locked test"
  exp_c: "Harmonized Pooled test"
  exp_d: "Train Edge-IIoTset -> Test CICIoT2023"
  exp_e: "Train CICIoT2023 -> Test Edge-IIoTset"
  exp_f: "Pooled vs Source-Specific comparison"

robustness:
  noise_std: [0.01, 0.05, 0.10]
  feature_dropout_rate: [0.05, 0.10, 0.20]
